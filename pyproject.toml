[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "py_oats"
version = "0.1.0"
dependencies = [
  "pymatgen",
  "pandas",
  "pymatgen-analysis-diffusion",
  "chgnet",
  "ase",
  "pydantic",
  "monty"
]
requires-python = ">=3.8"
authors = [
  {name = "Vir Karan", email = "virkaran@berkeley.edu"},
]
description = "A python package to analyze correlated ionic transport in amorphous solids."
readme = "README.md"
