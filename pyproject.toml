[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "py_oats"
version = "0.1.1"
description = "A python package to analyze correlated ionic transport in amorphous solids."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Vir Karan", email = "virkaran@berkeley.edu"},
]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "ase",
  "pymatgen",
  "pymatgen-core",
  "pymatgen-analysis-diffusion",
  "mp-api",
  "matminer",
  "packmol",
]

[project.optional-dependencies]
charge = ["chgnet"]

[tool.setuptools.package-data]
py_oats = ["structure_generator/data/*.json.gz", "templates/*.in"]

[tool.pytest.ini_options]
markers = [
    "integration: requires external API access (skip with '-m \"not integration\"')",
]
